; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



# This environment runs your main production code
[env:main]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<main.cpp> -<read_ir.cpp> -<calibrate_ir.cpp> -<drive_test.cpp>
monitor_speed = 9600

# This environment runs your testing code
[env:testing]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<read_ir.cpp> -<main.cpp> -<calibrate_ir.cpp> -<drive_test.cpp>
monitor_speed = 9600

# This environment runs the guided IR sensor calibration routine
[env:calibrate]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<calibrate_ir.cpp> -<main.cpp> -<read_ir.cpp> -<drive_test.cpp>
monitor_speed = 115200

# This environment runs the raw motor-direction test (no polarity correction)
[env:drive_test]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<drive_test.cpp> -<main.cpp> -<read_ir.cpp> -<calibrate_ir.cpp>
monitor_speed = 115200
