; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



# Shared dependency for the capture test and later main.cpp integration.
[env]
lib_deps = teckel12/NewPing@1.9.7

# This environment runs your main production code
[env:main]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<main.cpp> -<read_ir.cpp>

# This environment runs your testing code
[env:testing]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<read_ir.cpp> -<main.cpp>

# Standalone ultrasonic and capturing-hand test (no line following).
[env:capture_test]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = -<*> +<capture_test.cpp>
monitor_speed = 115200
